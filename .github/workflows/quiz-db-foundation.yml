name: Quiz database foundation

on:
  push:
    branches:
      - feature/update-2-4-0-quiz
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quiz-db-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swiftdictionary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d swiftdictionary_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: swiftdictionary_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare disposable Supabase-compatible Auth and learning schema
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/quiz_rpc_bootstrap.sql

      - name: Apply Quiz question-bank foundation
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261114120000_swiftdictionary_update_2_4_0_quiz_question_bank_foundation.sql

      - name: Validate Quiz question-bank foundation
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/quiz_question_bank_foundation.sql

      - name: Apply authenticated Quiz RPC migration
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261114160000_swiftdictionary_update_2_4_0_quiz_authenticated_rpcs.sql

      - name: Validate authenticated Quiz RPCs, session lifecycle and allowances
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/quiz_authenticated_rpcs.sql
