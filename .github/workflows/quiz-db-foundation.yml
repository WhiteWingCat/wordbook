name: Quiz database foundation

on:
  push:
    branches:
      - feature/update-2-4-0-quiz
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quiz-local-supabase:
    name: Local Supabase Auth and RPC integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create an isolated local Supabase workspace
        run: |
          mkdir -p "$RUNNER_TEMP/swiftdictionary-quiz-supabase"
          cd "$RUNNER_TEMP/swiftdictionary-quiz-supabase"
          supabase init
          cp "$GITHUB_WORKSPACE"/supabase/migrations/*.sql supabase/migrations/

      - name: Start disposable local Supabase services
        working-directory: \${{ runner.temp }}/swiftdictionary-quiz-supabase
        run: supabase start -x studio,edge-runtime,logflare,vector,imgproxy

      - name: Apply all repository migrations to local Supabase
        working-directory: \${{ runner.temp }}/swiftdictionary-quiz-supabase
        run: supabase db reset

      - name: Install test-only observers and run authenticated Quiz RPC integration tests
        working-directory: \${{ runner.temp }}/swiftdictionary-quiz-supabase
        run: |
          eval "$(supabase status --output env)"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/quiz_rpc_test_observers.sql"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/quiz_authenticated_rpcs.sql"

      - name: Run Supabase security advisors against the local Quiz schema
        working-directory: \${{ runner.temp }}/swiftdictionary-quiz-supabase
        run: supabase db advisors --type security --fail-on error

      - name: Stop disposable local Supabase services
        if: always()
        working-directory: \${{ runner.temp }}/swiftdictionary-quiz-supabase
        run: supabase stop --no-backup

  quiz-db-foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swiftdictionary_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d swiftdictionary_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: swiftdictionary_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare disposable Supabase-compatible Auth and learning schema
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/quiz_rpc_bootstrap.sql

      - name: Apply Quiz question-bank foundation
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261114120000_swiftdictionary_update_2_4_0_quiz_question_bank_foundation.sql

      - name: Validate Quiz question-bank foundation
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/quiz_question_bank_foundation.sql

      - name: Apply authenticated Quiz RPC migration
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261114160000_swiftdictionary_update_2_4_0_quiz_authenticated_rpcs.sql

      - name: Validate authenticated Quiz RPCs, session lifecycle and allowances
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/quiz_authenticated_rpcs.sql
